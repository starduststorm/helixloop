; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = v2

[env]
board_build.arduino.earlephilhower.usb_manufacturer = "starduststorm"
board_build.arduino.earlephilhower.usb_product = "helixloop"

[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino
lib_deps = 
	FastLED
	waspinator/AccelStepper@^1.64
build_flags =
	-D SAMD=1 -DHARDWARE_VERSION=1

[env:seeed_rp2040]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.filesystem_size = 0.5m
board = rpipico
build_flags = -DHARDWARE_VERSION=1
lib_deps = 
	FastLED
	waspinator/AccelStepper@^1.64

; custom_release_hw: board revisions an env's build is published for. .github/workflows/firmware.yml builds every env
; that has one and uploads its UF2 once per revision as helixloop-<version>-hw<rev>.uf2; the Newer Glow updater picks
; the asset matching the device's IDENTIFY hw=, so each revision here must be one the firmware reports at runtime.

[env:v2]
custom_release_hw = 2
extra_scripts = pre:lib/dustlib/scripts/fw_version.py
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.filesystem_size = 0.5m
board = rpipico
lib_deps = 
	FastLED/FastLED@3.10.3
build_flags = 
	-std=c++20 -DKISSFFT_DATATYPE=int16_t -DFIXED_POINT=1 -DHARDWARE_VERSION=2
